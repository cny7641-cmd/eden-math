<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#1D5FBF">
<title>이든수학 학생 리포트</title>
<style>
:root{--bg:#F5F6FB;--surface:#fff;--surface2:#EAF0F6;--ink:#17212C;--muted:#5B6877;--line:#D6DEE7;--accent:#1D5FBF;--accent-ink:#fff;--accent-soft:#E2ECFA;--good:#1B7A4B;--good-soft:#DDF1E6;--warn:#A65F00;--warn-soft:#FBEBCF;--bad:#B0302A;--bad-soft:#F9E0DD;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#10161D;--surface:#18202A;--surface2:#202B37;--ink:#E6ECF2;--muted:#9AA8B7;--line:#2C3846;--accent:#6EA3F0;--accent-ink:#0B1624;--accent-soft:#1B2D45;--good:#5FC38E;--good-soft:#15332A;--warn:#E3A24A;--warn-soft:#3A2D14;--bad:#F08A82;--bad-soft:#3B1D1B;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 'Noto Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;padding:0 16px calc(40px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:760px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:14px 0;flex-wrap:wrap}
.top b{font-size:18px}
button,input,select{font:inherit;color:inherit}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;min-height:40px;font-weight:600}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);width:100%}
.btn:disabled{opacity:.55;cursor:default}
.btn:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;min-height:44px;font-size:16px}
input[type=checkbox]{width:auto;min-height:0;margin-top:3px}
.login{max-width:380px;margin:12vh auto 0;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:12px}
.login h1{margin:0;font-size:20px}
.login label{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:4px;font-weight:600}
.login label.chk{flex-direction:row;gap:8px;align-items:flex-start}
.terms{font-size:14px;line-height:1.7;text-align:left;color:var(--ink)}
.pin{letter-spacing:.35em;text-align:center;font-size:22px}
.msg{font-size:13px;min-height:1.3em;color:var(--bad)}
.msg.ok{color:var(--good)}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.bar select{width:auto;min-width:150px}
.muted{color:var(--muted)}
[hidden]{display:none!important}
.foot{margin-top:24px;font-size:12px;color:var(--muted);text-align:center}
</style>
<style id="er-css"></style>
</head>
<body>
<div class="wrap">
  <section id="info" class="login" hidden>
    <h1 id="info-t">이든수학 학생 리포트</h1>
    <p class="muted" id="info-p" style="margin:0"></p>
  </section>

  <section id="pinbox" class="login" hidden>
    <h1>PIN을 입력해 주세요</h1>
    <p class="muted" style="margin:0">내가 정한 숫자 PIN을 입력하면 리포트가 열려요. 이 폰에서는 한 번만 입력하면 돼요.</p>
    <form id="pf" style="display:contents">
      <label>PIN (숫자 4~6자리)<input id="pin" class="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="6" required></label>
      <div class="msg" id="pmsg" role="alert"></div>
      <button class="btn pri" id="pbtn" type="submit">열기</button>
    </form>
  </section>

  <section id="setup" class="login" hidden>
    <h1 id="setup-t">처음 한 번만 설정해 주세요</h1>
    <p class="muted" style="margin:0" id="setup-p">나만 아는 숫자 PIN을 정해 주세요.</p>
    <div class="terms" style="font-size:13px">이 리포트는 본인과 보호자만 볼 수 있어요. 링크는 다른 사람에게 보내지 마세요.</div>
    <form id="sf" style="display:contents">
                  <div id="pinset">
        <label>사용할 PIN (숫자 4~6자리)<input id="np" class="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="6"></label>
        <label style="margin-top:8px">PIN 한 번 더<input id="np2" class="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="6"></label>
        <div class="small muted" style="font-size:12px;margin-top:6px">생일·전화번호처럼 남이 알기 쉬운 숫자는 피해 주세요. PIN을 잊으면 선생님께 말해 주세요.</div>
      </div>
      <div class="msg" id="smsg" role="alert"></div>
      <button class="btn pri" id="sbtn" type="submit">시작하기</button>
    </form>
  </section>

  <section id="app" hidden>
    <div class="top"><b id="who">이든수학 학생 리포트</b>
      <div><button class="btn" id="outbtn">이 기기에서 나가기</button></div>
    </div>
    <div class="bar"><label for="msel" class="muted">월 선택</label><select id="msel"></select></div>
    <div class="msg" id="amsg" role="alert"></div>
    <div id="rep"></div>
    <p class="foot">이 화면은 본인에게만 보여요. 링크와 PIN을 다른 사람과 공유하지 마세요.</p>
  </section>
</div>
<script src="config.js"></script>
<script src="report-view.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
(function () {
  'use strict';
  var $ = function (s) { return document.querySelector(s); };
  var cfg = window.EDEN_CFG || {};
  $('#er-css').textContent = window.EdenReport ? window.EdenReport.css : '';
  /* 서버에 기록되는 안내 버전(동의 재요청은 하지 않아요) */
  var CONSENT_VER = '2026-11';
  var sb = null, reports = {}, token = '', setupMode = 'new';

  function show(which) { ['info', 'pinbox', 'setup', 'app'].forEach(function (k) { $('#' + k).hidden = k !== which; }); }
  function info(t, p) { $('#info-t').textContent = t; $('#info-p').textContent = p || ''; show('info'); }
  if (!cfg.SUPABASE_URL || !cfg.SUPABASE_ANON_KEY || !window.supabase) { info('서비스가 아직 준비되지 않았어요', '선생님께 알려 주세요.'); return; }
  sb = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY, { auth: { persistSession: false, autoRefreshToken: false } });

  /* 링크의 # 뒤 값(서버에 전달되지 않아요)에서 내 열쇠를 읽고, 이 폰에 기억해 둬요. 링크가 없으면 기억해 둔 것을 써요 */
  function getToken() {
    var m = (location.hash || '').match(/[#&]t=([A-Za-z0-9_-]{20,80})/);
    if (m) { try { localStorage.setItem('eden_rl_t', m[1]); } catch (e) { } return m[1]; }
    try { return localStorage.getItem('eden_rl_t') || ''; } catch (e) { return ''; }
  }
  function getDevice() { try { var o = JSON.parse(localStorage.getItem('eden_rl_d') || 'null'); return o && o.t === token ? o.d : ''; } catch (e) { return ''; } }
  function setDevice(d) { try { localStorage.setItem('eden_rl_d', JSON.stringify({ t: token, d: d })); } catch (e) { } }
  function clearAll() { try { localStorage.removeItem('eden_rl_d'); localStorage.removeItem('eden_rl_t'); } catch (e) { } }
  async function rpc(name, args) { var r = await sb.rpc(name, args); if (r.error) throw r.error; return r.data || {}; }
  var untilTxt = function (u) { try { var d = new Date(u); return (d.getMonth() + 1) + '월 ' + d.getDate() + '일 ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); } catch (e) { return ''; } };
  function lockedInfo(u) { info('잠시 잠겼어요', 'PIN을 여러 번 틀려서 ' + (u ? untilTxt(u) + ' 이후에' : '잠시 뒤에') + ' 다시 해 볼 수 있어요. 급하면 선생님께 말해 주세요.'); }
  var failInfo = function () { info('불러오지 못했어요', '인터넷 연결을 확인하고 다시 열어 주세요. 계속 안 되면 선생님께 알려 주세요.'); };

  function draw() { var v = reports[$('#msel').value]; $('#rep').innerHTML = window.EdenReport.render(v); }
  $('#msel').addEventListener('change', draw);
  function showReports(list) {
    reports = {}; list.forEach(function (x) { reports[x.month] = x.payload; });
    var months = list.map(function (x) { return x.month; });
    show('app'); $('#amsg').textContent = '';
    $('#who').textContent = list.length && list[0].payload && list[0].payload.name ? list[0].payload.name + ' 학생 리포트' : '이든수학 학생 리포트';
    if (!months.length) { $('#msel').innerHTML = ''; $('#rep').innerHTML = '<div class="er"><div class="er-empty">아직 발행된 리포트가 없어요. 선생님이 올리면 여기에 보여요.</div></div>'; return; }
    $('#msel').innerHTML = months.map(function (m) { return '<option value="' + m + '">' + m.replace('-', '년 ') + '월</option>'; }).join('');
    draw();
  }

  async function openReports() {
    var dev = getDevice(); if (!dev) return status();
    var r;
    try { r = await rpc('rl_reports', { p_token: token, p_device: dev, p_ver: CONSENT_VER }); } catch (e) { return failInfo(); }
    if (r.ok) return showReports(r.reports || []);
    /* 동의 문구 버전이 바뀌어도 다시 묻지 않아요 */
    if (r.error === 'bad_device') { try { localStorage.removeItem('eden_rl_d'); } catch (e) { } return status(); }
    return info('링크가 맞지 않아요', '링크가 바뀌었거나 사용할 수 없어요. 선생님께 새 링크를 받아 주세요.');
  }
  async function status() {
    var r; try { r = await rpc('rl_status', { p_token: token }); } catch (e) { return failInfo(); }
    if (r.state === 'invalid') { clearAll(); return info('링크가 맞지 않아요', '링크가 바뀌었거나 사용할 수 없어요. 선생님께 새 링크를 받아 주세요.'); }
    if (r.state === 'locked') return lockedInfo(r.until);
    if (r.state === 'need_pin_setup') { setupMode = 'new'; return showSetup(); }
    $('#pin').value = ''; $('#pmsg').textContent = ''; show('pinbox'); $('#pin').focus();
  }
  function showSetup() {
    $('#np').value = ''; $('#np2').value = ''; $('#smsg').textContent = '';
    show('setup');
  }

  $('#pf').addEventListener('submit', async function (e) {
    e.preventDefault(); var pin = $('#pin').value.trim(); if (!/^[0-9]{4,6}$/.test(pin)) { $('#pmsg').textContent = 'PIN은 숫자 4~6자리예요.'; return; }
    $('#pbtn').disabled = true; $('#pmsg').textContent = '';
    try {
      var r = await rpc('rl_login', { p_token: token, p_pin: pin });
      if (r.ok) { setDevice(r.device); $('#pin').value = ''; $('#pbtn').disabled = false; return openReports(); }
      if (r.error === 'locked' || (r.error === 'bad_pin' && r.left === 0)) { $('#pbtn').disabled = false; return lockedInfo(r.until); }
      if (r.error === 'bad_pin') $('#pmsg').textContent = 'PIN이 맞지 않아요. (' + r.left + '번 더 틀리면 잠시 잠겨요)';
      else if (r.error === 'need_setup') { $('#pbtn').disabled = false; return status(); }
      else { $('#pbtn').disabled = false; return info('링크가 맞지 않아요', '선생님께 새 링크를 받아 주세요.'); }
      $('#pin').value = '';
    } catch (er) { $('#pmsg').textContent = '불러오지 못했어요. 잠시 후 다시 해 보세요.'; }
    $('#pbtn').disabled = false;
  });

  $('#sf').addEventListener('submit', async function (e) {
    e.preventDefault(); var msg = $('#smsg'); msg.textContent = '';

    var a = $('#np').value.trim(), b = $('#np2').value.trim();
    {
      if (!/^[0-9]{4,6}$/.test(a)) { msg.textContent = 'PIN은 숫자 4~6자리로 정해 주세요.'; return; }
      if (a !== b) { msg.textContent = '두 PIN이 달라요.'; return; }
      if (/^(\d)\1+$/.test(a) || a === '1234' || a === '123456' || a === '0000') { msg.textContent = '너무 쉬운 PIN이에요. 다른 숫자로 해 주세요.'; return; }
    }
    $('#sbtn').disabled = true;
    try {
      var r = await rpc('rl_setup', { p_token: token, p_pin: a, p_ver: CONSENT_VER });
      $('#sbtn').disabled = false;
      if (r.ok) { setDevice(r.device); return openReports(); }
      if (r.error === 'already') return status();
      msg.textContent = r.error === 'bad_format' ? 'PIN은 숫자 4~6자리로 정해 주세요.' : '설정하지 못했어요. 선생님께 새 링크를 받아 주세요.';
    } catch (er) { $('#sbtn').disabled = false; msg.textContent = '저장하지 못했어요. 잠시 후 다시 해 보세요.'; }
  });

  $('#outbtn').addEventListener('click', function () { clearAll(); reports = {}; $('#rep').innerHTML = ''; info('나갔어요', '다시 보려면 선생님이 준 링크(QR)로 들어와 주세요.'); });

  token = getToken();
  if (!token) info('이든수학 학생 리포트', '선생님이 보내 준 링크(또는 QR)로 들어와 주세요. 링크 없이는 열 수 없어요.');
  else openReports();
})();
</script>
</body>
</html>
