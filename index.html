[data-kc="0"]{--cb:var(--k0b);--ci:var(--k0i);--cb2:var(--k0i)} [data-kc="1"]{--cb:var(--k1b);--ci:var(--k1i);--cb2:var(--k1i)} [data-kc="2"]{--cb:var(--k2b);--ci:var(--k2i);--cb2:var(--k2i)}

  if (s.nf) lines.push(`<div class="gl"><span class="tg fin">${esc(s.nf.blk)}총괄</span> ${s.nf.c !== s.c ? cn(s.nf.c) + ' ' : ''}${s.nf.n}회 · ${dRange(s.nf.ds)}</div>`);

    <div class="gc-p"><b class="mono">${nTxt}</b><span class="muted small"> / ${len}회</span><span class="bar" role="img" aria-label="${s.nmax}/${len}회 진행"><i style="width:${pct}%"></i></span></div>
    <div class="gc-ks">${s.rows.sort((a, b) => b.e.n - a.e.n).map(r => `<button class="gc-k" data-act="k-open" data-k="${r.k.id}"><span><b>${esc(shortT(tchOn(r.k, d)))}</b> ${esc(r.k.name)}</span><span class="mono small">${r.e.c !== s.c ? r.e.c + ' ' : ''}${r.e.n}회</span></button>`).join('')}</div>

function campBoard() {

  const run = states.filter(s => s.st === 'run'), soon = states.filter(s => s.st === 'soon').sort((a, b) => tl(a.soon[0])[0].d.localeCompare(tl(b.soon[0])[0].d));

  <div class="small muted">${md(d)} 기준 · 같은 진도로 함께 가는 반을 한 카드로 묶었어요. 카드 색은 과정, 막대는 그 과정에서 몇 회까지 왔는지예요. 그룹 이름을 누르면 회차별 날짜가 나와요.${hot ? ` 주황 테두리 카드 ${hot}개는 2주 안에 총괄이나 과정 변경이 있어요.` : ''}</div>
  <div class="board">${COURSES.map(c => { const list = run.filter(s => s.c === c); const nk = list.reduce((a, s) => a + s.rows.length, 0); return `<section class="bcol"${ccC(c)}>
    <button class="bcol-h" data-act="k-course" data-c="${c}"><span>${cn(c)}</span><span class="small">${list.length ? `${list.length}그룹 · ${nk}개 반` : '비어 있음'}</span></button>
    ${list.sort((a, b) => b.nmax - a.nmax).map(s => grpCard(s, d)).join('') || '<div class="bempty">지금 이 과정을 듣는 반이 없어요</div>'}</section>`; }).join('')}</div>
  ${soon.length ? `<section class="card stack"><div class="card-h" style="margin:0"><h3>개강 예정 그룹</h3><span class="small muted">(개강일 기준 · 연도 표시)</span><span class="sub">${soon.length}그룹</span></div>
    <div class="soon">${soon.map(s => { const f = s.soon.map(k => tl(k)[0]); return `<div class="soon-r"><span class="mono">${dRangeY(f.map(e => e.d))}</span><span>${cChip(f[0].c)} <b>${esc(grpName(s.g))}</b></span><span class="small">${s.soon.map(k => `<a href="#" data-act="k-open" data-k="${k.id}">${esc(kLab(k, f[0].d))}</a>`).join(', ')} <button class="btn sm" data-act="k-addto" data-g="${esc(s.g.id)}" data-c="${f[0].c}">+ 반 추가</button></span></div>`; }).join('')}</div></section>` : ''}
  ${done ? `<div class="small muted">종강한 그룹 ${done}개는 반 목록의 '종강'에서 볼 수 있어요.</div>` : ''}`;
}

/* ---- 진도 타임라인: 그룹별 과정 막대 ---- */
function campTimeline() {
  const d = S.ui.date; const states = campGroups().map(g => grpState(g, d)).filter(s => s && s.st !== 'done');
  if (!states.length) return '<section class="card empty">표시할 그룹이 없어요.</section>';
  const [y0, m0] = addDays(d, -45).split('-').map(Number); const t0 = `${y0}-${pad(m0)}-01`;
  let tEnd = t0; states.forEach(s => s.ks.forEach(k => { const t = tl(k); if (t.length && t[t.length - 1].d > tEnd) tEnd = t[t.length - 1].d; }));
  const [y1, m1] = tEnd.split('-').map(Number); const t1 = ymd(new Date(y1, m1, 1));
  const ms = s => parseD(s).getTime(); const T0 = ms(t0), SPAN = ms(t1) - T0;
  const pos = s => Math.max(0, Math.min(100, (ms(s) - T0) / SPAN * 100));
  const months = []; for (let dt = new Date(y0, m0 - 1, 1); ymd(dt) < t1; dt = new Date(dt.getFullYear(), dt.getMonth() + 1, 1)) months.push(ymd(dt));
  const order = s => (s.st === 'run' ? 0 : 1) * 10 - cIdx(s.c) + (s.st === 'soon' ? 0 : 0);
  const rows = states.sort((a, b) => order(a) - order(b) || (a.st === 'soon' ? tl(a.soon[0])[0].d.localeCompare(tl(b.soon[0])[0].d) : b.nmax - a.nmax));
  const seg = s => {
    const by = {}; s.ks.forEach(k => tl(k).forEach(e => { const b = by[e.c] || (by[e.c] = { a: e.d, z: e.d }); if (e.d < b.a) b.a = e.d; if (e.d > b.z) b.z = e.d; }));
    return COURSES.filter(c => by[c] && by[c].z >= t0).map(c => { const l = pos(by[c].a), r = pos(addDays(by[c].z, 1)); return `<span class="tseg"${ccC(c)} style="left:${l}%;width:${Math.max(.6, r - l)}%" title="${cn(c)} ${md(by[c].a)} ~ ${md(by[c].z)}">${r - l > 4 ? c : ''}</span>`; }).join('');
  };
  const endFlag = s => { const e = s.ks.map(k => tl(k)).map(t => t[t.length - 1]).filter(x => x && isLast(x)).map(x => x.d).sort().pop(); return e ? `<span class="tend" style="left:${pos(addDays(e, 1))}%">중등 ${md(e)}</span>` : ''; };
  const legend = `<div class="legend">${COURSES.map(c => `<span>${cChip(c)}</span>`).join('')}<span class="small muted">세로선은 ${md(d)}</span></div>`;
  return `<section class="card stack">${legend}
    <div class="tl-wrap"><div class="tlx">
      <div class="tl-r tl-head"><div class="tl-l"></div><div class="tl-t">${months.map(m => `<span class="tm" style="left:${pos(m)}%">${m.slice(5, 7) === '01' || m === months[0] ? m.slice(2, 4) + '년 ' : ''}${+m.slice(5, 7)}월</span>`).join('')}</div></div>
      ${rows.map(s => `<div class="tl-r"><div class="tl-l"><button class="gc-n" data-act="k-course" data-c="${s.c}" data-g="${esc(s.g.id)}">${esc(grpName(s.g))}</button><div class="small muted">${s.ks.map(k => esc(kLab(k, d))).join(', ')}</div></div>
        <div class="tl-t">${months.map(m => `<i class="tgrid" style="left:${pos(m)}%"></i>`).join('')}${seg(s)}${endFlag(s)}<i class="tnow" style="left:${pos(d)}%"></i></div></div>`).join('')}
    </div></div></section>`;
}

/* ---- 과정별: 한 과정의 그룹별 회차 날짜 ---- */
function campCourse() {
  const d = S.ui.date; const states = campGroups().map(g => grpState(g, d)).filter(Boolean);
  const cnt = c => states.filter(s => s.st === 'run' && s.c === c).length;
  const c = S.ui.campCourse || (COURSES.find(x => cnt(x)) || '1-1'); const len = courseLen(c);
  const here = states.filter(s => s.st === 'run' && s.c === c).sort((a, b) => b.nmax - a.nmax);
  const coming = []; states.forEach(s => { if (s.c === c && s.st === 'run') return; const hit = s.ks.map(k => tl(k).find(e => e.c === c && e.n === 1 && e.d > d)).filter(Boolean); if (hit.length) coming.push({ s, ds: hit.map(e => e.d) }); });
  coming.sort((a, b) => [...a.ds].sort()[0].localeCompare([...b.ds].sort()[0]));
  const all = !!S.ui.campAllRows;
  const tbl = s => {
    const ks = s.g.ks.filter(k => kMatch(k, d) && tl(k).some(e => e.c === c));
    const from = all ? 1 : Math.max(1, s.nmin - 1);
    const rows = []; for (let n = from; n <= len; n++) rows.push(n);
    return `<div class="tbl-wrap"><table class="ctbl"><thead><tr><th>회차</th><th>구분</th>${ks.map(k => `<th>${esc(kLab(k, d))}</th>`).join('')}<th>단원</th></tr></thead><tbody>${rows.map(n => {
      const pr = planRow(c, n); const es = ks.map(k => tl(k).find(e => e.c === c && e.n === n));
      const past = es.every(e => !e || e.d < d); const now = es.some(e => e && e.d === d);
      return `<tr class="${past ? 'past' : ''}${now ? ' now' : ''}${pr && pr.fin ? ' finr' : ''}"><td>${n}회</td><td>${pr ? esc(pr.blk) + (pr.fin ? ' <span class="pill warn">총괄</span>' : '') : ''}</td>${es.map(e => `<td class="mono">${e ? mdw(e.d) : '-'}</td>`).join('')}<td>${esc(pr ? pr.unit : '')}</td></tr>`;
    }).join('')}${(() => {
      const nc = nextCourse(c);
      if (nc) {
        const es = ks.map(k => tl(k).find(e => e.c === nc && e.n === 1)); const p1 = planRow(nc, 1);
        return `<tr class="nextr"${ccC(nc)}><td>다음</td><td><b>${cn(nc)} 개강</b></td>${es.map(e => `<td class="mono"><b>${e ? mdw(e.d) : '미정'}</b></td>`).join('')}<td>${p1 ? '1회 ' + esc(p1.unit) : ''}</td></tr>`;
      }
      const es = ks.map(k => { const t = tl(k); const e = t[t.length - 1]; return e && isLast(e) ? e : null; });
      const ev = S.campus.events.filter(x => x.grp && x.grp === s.g.id && /중등/.test(x.text)).map(x => x.text).join(' · ');
      return `<tr class="nextr endr"><td>다음</td><td><b>중등 진학</b></td>${es.map(e => `<td class="mono"><b>${e ? mdw(e.d) + ' 마지막' : '-'}</b></td>`).join('')}<td>${esc(ev)}</td></tr>`;
    })()}</tbody></table></div>`;
  };
  return `
  <div class="seg tabx" role="group" aria-label="과정">${COURSES.map(x => `<button data-act="k-course" data-c="${x}"${ccC(x)} aria-pressed="${x === c}">${cn(x)} <span class="small">${cnt(x)}</span></button>`).join('')}</div>
  <div class="row" style="justify-content:space-between"><div class="small muted">${cn(c)} 전체 ${len}회 · 지금 ${here.length}그룹이 듣고 있어요. 같은 회차를 반별로 나란히 볼 수 있어요.</div>
    <label class="small"><input type="checkbox" data-ch="k-allrows" ${all ? 'checked' : ''}> 지난 회차도 보기</label></div>
  ${here.map(s => `<section class="card stack${S.ui.campGrp === s.g.id ? ' focus' : ''}"${ccC(c)} id="grp-${esc(s.g.id)}">
    <div class="card-h" style="margin:0"><div class="row"><input type="text" class="gname" aria-label="그룹 이름" data-ch="k-gname" data-g="${esc(s.g.id)}" value="${esc(grpName(s.g))}"><span class="mono">${s.nmin === s.nmax ? s.nmax : s.nmin + '~' + s.nmax} / ${len}회</span></div>
      <div class="row"><span class="sub">${s.no ? `다음 ${cn(s.no.c)} ${dRange(s.no.ds)}` : s.ne ? `중등 진학 ${dRange(s.ne.ds)}` : ''}</span>
        <button class="btn sm" data-act="k-addto" data-g="${esc(s.g.id)}" data-c="${c}">+ ${cn(c)}부터 반 추가</button>
        ${nextCourse(c) ? `<button class="btn sm" data-act="k-addto" data-g="${esc(s.g.id)}" data-c="${nextCourse(c)}">+ ${cn(nextCourse(c))}부터 반 추가</button>` : ''}</div></div>
    ${tbl(s)}</section>`).join('') || `<section class="card empty">지금 ${cn(c)}을 듣는 그룹이 없어요.</section>`}
  ${coming.length ? `<section class="card stack"><div class="card-h" style="margin:0"><h3>${cn(c)}에 들어올 그룹</h3></div>${coming.map(x => `<div class="soon-r"><span class="mono">${dRange(x.ds)}</span><span><b>${esc(grpName(x.s.g))}</b></span><span class="small">${x.s.ks.map(k => esc(kLab(k, d))).join(', ')} <button class="btn sm" data-act="k-addto" data-g="${esc(x.s.g.id)}" data-c="${c}">+ ${cn(c)}부터 반 추가</button></span></div>`).join('')}</section>` : ''}`;
}

function campWeek() {
  const d = S.ui.date; const mon = addDays(d, -((dowOf(d) + 6) % 7));
  const days = [0, 1, 2, 3, 4, 5].map(i => addDays(mon, i));
  const today = dayItems(d).filter(x => !x.off);
  const wkAll = days.flatMap(x => dayItems(x).filter(i => !i.off).map(i => Object.assign({ d: x }, i)));
  const up = campUpcoming(d, 28);
  const run = S.campus.classes.filter(k => kStatus(k, d).s === 'run' && kMatch(k, d)).length;
  const stat = `<div class="kstat"><div><b>${today.length}</b><span>${md(d)} 수업</span></div><div><b>${wkAll.length}</b><span>이번 주 수업</span></div><div><b>${wkAll.filter(x => x.fin).length}</b><span>이번 주 총괄</span></div><div><b>${up.filter(x => x.kind === '개강').length}</b><span>4주 안 과정 개강</span></div><div><b>${run}</b><span>운영 중인 반</span></div></div>`;
  return `
  <section class="card stack">${stat}</section>
  <section class="stack"><div class="row" style="justify-content:space-between"><h3>${md(mon)} ~ ${md(days[5])} 주간 수업</h3>
    <div class="row"><button class="btn sm" data-act="k-week" data-n="-7">‹ 지난주</button><button class="btn sm" data-act="k-week" data-n="7">다음 주 ›</button></div></div>
    ${(() => {
      const per = days.map(x => dayItems(x).map(i => Object.assign({ c: i.off ? offC(i.k, x) : i.e.c }, i)));
      const cs = COURSES.filter(c => per.some(l => l.some(i => i.c === c)));
      if (!cs.length) return '<div class="card empty">이번 주 수업이 없어요.</div>';
      return `<div class="cw"><div class="cw-h"></div>${days.map(x => `<div class="cw-h${x === todayStr() ? ' today' : ''}">${mdw(x)}</div>`).join('')}
      ${cs.map(c => `<div class="cw-l"${ccC(c)}><b>${cn(c)}</b><span class="small">${per.reduce((a, l) => a + l.filter(i => i.c === c && !i.off).length, 0)}회</span></div>${days.map((x, j) => { const its = per[j].filter(i => i.c === c); return `<div class="cw-c${x === todayStr() ? ' today' : ''}${its.length ? '' : ' empty'}"><span class="cw-dl">${mdw(x)}</span>${its.map(i => kiHtml(i, x)).join('')}</div>`; }).join('')}`).join('')}</div>`;
    })()}</section>
  <section class="card stack"><div class="card-h" style="margin:0"><h3>앞으로 4주 주요 일정</h3><span class="sub">과정 개강 · 총괄평가 · 마지막 수업 · 강사 변경 · 메모 · 휴강</span></div>
    ${up.length ? `<div class="up-l">${up.map(u => `<div class="up-r"><span class="mono">${mdw(u.d)}</span><span><span class="pill ${u.pc}">${esc(u.kind)}</span></span><span>${u.k ? `<a href="#" data-act="k-open" data-k="${u.k}">${esc(u.text)}</a>` : esc(u.text)}</span></div>`).join('')}</div>` : '<div class="empty">4주 안에 특별한 일정이 없어요.</div>'}</section>`;
}

function campMonth() {
  const d = S.ui.date; const [y, m] = d.split('-').map(Number);
  const first = `${y}-${pad(m)}-01`; const last = ymd(new Date(y, m, 0));
  let s = addDays(first, -((dowOf(first) + 6) % 7)); const cells = [];
  while (s <= last || cells.length % 6) { if (dowOf(s) !== 0) cells.push(s); s = addDays(s, 1); if (cells.length > 42) break; }
  const evs = S.campus.events.filter(e => e.d >= cells[0] && e.d <= cells[cells.length - 1] && evMatch(e, e.d));
  const prevM = ymd(new Date(y, m - 2, 1)), nextM = ymd(new Date(y, m, 1));
  return `
  <section class="stack"><div class="row" style="justify-content:space-between"><h3>${y}년 ${m}월</h3>
    <div class="row"><button class="btn sm" data-act="k-goto" data-d="${prevM}">‹ ${new Date(y, m - 2, 1).getMonth() + 1}월</button><button class="btn sm" data-act="k-goto" data-d="${nextM}">${new Date(y, m, 1).getMonth() + 1}월 ›</button></div></div>
    <div class="legend">${COURSES.map(c => `<span>${cChip(c)}</span>`).join('')}<span class="small muted">색은 과정, 글자는 "강사 반 · 회차"예요. 굵은 칸은 과정 개강과 총괄이에요.</span></div>
    <div class="mcal">${'월화수목금토'.split('').map(w => `<div class="mch">${w}</div>`).join('')}
    ${cells.map(c => {
      const its = dayItems(c); const out = c.slice(0, 7) !== first.slice(0, 7); const de = evs.filter(e => e.d === c);
      const body = its.sort((a, b) => (a.off ? 1 : 0) - (b.off ? 1 : 0) || (a.e && b.e ? cIdx(a.e.c) - cIdx(b.e.c) : 0)).map(i => i.off ? `<div class="mi off"${ccC(offC(i.k, c))} data-act="k-open" data-k="${i.k.id}">${esc(kLab(i.k, c))} 휴강</div>`
        : `<div class="mi${i.fin ? ' fin' : ''}${i.open ? ' open' : ''}"${ccC(i.e.c)} data-act="k-open" data-k="${i.k.id}" title="${esc(cn(i.e.c) + ' ' + i.e.n + '회' + (i.fin ? ' ' + i.fin : ''))}">${esc(kLab(i.k, c))} · ${i.e.n}${i.fin ? ' 총괄' : ''}${i.open ? ' 개강' : ''}</div>`).join('')
        + de.map(e => `<div class="mi ev">${esc(e.text)}</div>`).join('');
      return `<div class="mc${out ? ' out' : ''}${c === todayStr() ? ' today' : ''}${body ? '' : ' empty'}"><div class="mc-d">${+c.slice(8)}<span class="wd"> (${DOW[dowOf(c)]}) · ${+c.slice(5, 7)}월</span></div>${body}</div>`;
    }).join('')}</div></section>`;
}

/* ---- 개강 예정 표: 연도까지 표시, 첫 개강일과 다음 과정 시작일을 따로 ---- */
const ymdw = d => { const p = parseD(d); return `${p.getFullYear()}.${String(p.getMonth() + 1).padStart(2, '0')}.${String(p.getDate()).padStart(2, '0')}(${DOW[p.getDay()]})`; };
const dRangeY = ds => { const u = [...new Set(ds)].sort(); if (!u.length) return ''; return u.length === 1 ? ymdw(u[0]) : `${ymdw(u[0])} ~ ${ymdw(u[u.length - 1])}`; };
function campSoonCard(list, d) {
  const items = list.map(k => { const t = tl(k), f = t[0] || null, nx = f ? (t.find(e => e.c !== f.c) || null) : null; return { k, f, nx }; })
    .sort((a, b) => (a.f ? a.f.d : '9999').localeCompare(b.f ? b.f.d : '9999') || a.k.name.localeCompare(b.k.name));
  const years = [...new Set(items.filter(x => x.f).map(x => x.f.d.slice(0, 4)))].sort(); const yf = years.includes(S.ui.campYear) ? S.ui.campYear : '';
  const shown = items.filter(x => !yf || !x.f || x.f.d.slice(0, 4) === yf);

/* 한글 본문의 압축 데이터는 끝에 군더더기가 붙어 있을 수 있어, 브라우저의 엄격한 해제가 실패하면 끝을 조금씩 잘라 가며 풀어요 */
async function hwpInflate(b) {
  const dec = async u => new Uint8Array(await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());
  let last;
  for (let cut = 0; cut <= 48 && cut < b.length; cut++) { try { return await dec(cut ? b.slice(0, b.length - cut) : b); } catch (e) { last = e; } }
  throw new Error('압축을 풀지 못했어요 (' + ((last && last.message) || '') + ')');
}
async function hwpText(buf) {
  const X = await loadXLSX(); if (!X.CFB) throw new Error('한글 파일을 읽는 도구를 불러오지 못했어요');
  const u8 = new Uint8Array(buf);
  if (u8[0] === 0x50 && u8[1] === 0x4b) throw new Error('.hwpx 형식이에요. 한글에서 .hwp로 다시 저장해 올려 주세요');
  let cf; try { cf = X.CFB.read(u8, { type: 'array' }); } catch (e) { throw new Error('한글(.hwp) 파일이 아니에요'); }
  const hd = X.CFB.find(cf, 'FileHeader'); if (!hd) throw new Error('한글(.hwp) 파일이 아니에요');
  const H = Uint8Array.from(hd.content), flags = new DataView(H.buffer).getUint32(36, true);
  if (flags & 2) throw new Error('암호가 걸린 파일이에요');
  const secs = cf.FullPaths.map((p, i) => [p, cf.FileIndex[i]]).map(([p, e]) => [/BodyText\/Section(\d+)$/.exec(p), e]).filter(([m]) => m).sort((a, b) => +a[0][1] - +b[0][1]);
  if (!secs.length) throw new Error('본문을 찾지 못했어요');
  let out = '';
  for (const [, ent] of secs) {
    let b = Uint8Array.from(ent.content);
    if (flags & 1) b = await hwpInflate(b);
    const dv = new DataView(b.buffer, b.byteOffset, b.byteLength); let off = 0;
    while (off + 4 <= b.length) {
      const h = dv.getUint32(off, true); off += 4; const tag = h & 0x3ff; let size = h >>> 20;
      if (size === 0xfff) { size = dv.getUint32(off, true); off += 4; }
      if (tag === 67) {
        let s = '';
        for (let i = off, e = off + size; i + 1 < e;) {
          const c = dv.getUint16(i, true);
          if (c >= 32) { s += String.fromCharCode(c); i += 2; }
          else if (c === 0 || c === 10 || c === 13 || (c >= 24 && c <= 31)) { if (c === 13) s += '\n'; i += 2; }
          else i += 16;
        }
        out += s + '\n';
      }
      off += size;
    }
  }
  return out;
}
function quFromText(text, fname) {
  const re = /(초등|\d-\d)\s*과정\s*누적\s*테스트\s*(\d+)\s*회/;
  const tm = text.slice(0, 600).match(re) || String(fname || '').match(re);
  if (!tm) return { err: '누적테스트 시험지가 아닌 것 같아요 (제목에서 과정·회차를 못 찾았어요)' };
  const tg = /\[Ch\.([^\s\]]+)\s+([^\]]*?)\s+([ABCX]\d?)\]/g, t = []; let x;
  while ((x = tg.exec(text))) t.push([x[2].trim(), x[3], x[1]]);
  if (!t.length) return { err: '문항별 단원 표기([Ch.단원 난이도])를 찾지 못했어요' };
  return { c: tm[1], n: +tm[2], t, warn: t.length !== 20 ? `문항 표기가 ${t.length}개예요 (20개가 아님)` : '' };
}
CH['qu-up'] = async el => {
  const files = [...el.files]; el.value = ''; if (!files.length) return;
  S.cfg.qunits = S.cfg.qunits || {}; const msg = []; let ok = 0;
  for (const f of files) {
    try {
      const r = quFromText(await hwpText(await f.arrayBuffer()), f.name);
      if (r.err) { msg.push(`❌ ${f.name}: ${r.err}`); continue; }
      S.cfg.qunits[quKey(r.c, r.n)] = { t: r.t, f: f.name, at: Date.now() }; ok++;

};

/* 반 학생별 집계: 영역(문항 과정×출처)과 단원 둘 다 한 번에. 오답 번호가 입력된 시험만 세요 */
function quStats(cls, filt) {
  const sts = studentsOf(cls.id), out = {}; sts.forEach(st => { out[st.id] = { name: st.name, k: {}, u: {}, n: 0 }; });
  Object.values(S.sess).filter(r => r.cls === cls.id && !finOf(r) && filt(r)).forEach(rec => {
    const qm = quOf(rec.c, rec.n), km = qKindMap(rec.c, rec.n), tq = totalQs(rec);
    sts.forEach(st => {
      const r = rec.r && rec.r[st.id]; if (!r || stOf(r) !== 'ok') return; if (st.joined && (rec.d || '') < st.joined) return;
      if (!((r.wrong || '') + (r.add || '')).trim()) return;
      const w = new Set(parseNums(r.wrong).concat(parseNums(r.add)).filter(x => x > 0)), o = out[st.id]; o.n++;
      for (let q = 1; q <= tq; q++) {
        const m = km[q]; if (m && m.k !== 'X') { const key = m.c + '|' + m.k, a = o.k[key] || (o.k[key] = { ok: 0, tot: 0 }); a.tot++; if (!w.has(q)) a.ok++; }
        const u = qm && qm.t[q - 1]; if (u) { const uc = (m && m.c) || rec.c, uk = uc + '|' + u[0].replace(/\s+/g, ''), a = o.u[uk] || (o.u[uk] = { w: 0, t: 0, c: uc }); a.t++; if (w.has(q)) a.w++; }
      }

  });

}

/* 반에서 고를 수 있는 과정(그 반 수업 기록이 있는 과정)과, 선택된 과정 */
function rptCourseOpts(cls) { return cls ? ALLC().filter(c => Object.values(S.sess).some(r => r.cls === cls.id && r.c === c && !finOf(r))) : []; }
function rptSelCourses(cls) {

/* 미완료 과제: 과제 검사에서 '일부미흡'·'미제출'로 표시된 항목 */
function rptHwOpen(s, filt) {
  const out = [];
  Object.values(S.sess).forEach(rec => {
    const r = rec.r && rec.r[s.id]; if (!r || !r.hwc || !filt(rec)) return;
    Object.entries(r.hwc).forEach(([k, v]) => { if (HWC_T[v]) out.push({ d: rec.d || '', c: rec.c, n: rec.n, item: k, st: HWC_T[v] }); });
  });
  return out.sort((a, b) => a.d.localeCompare(b.d) || a.n - b.n);
}
const rptKinds = (ag, sid) => { const me = ag[sid]; return me ? Object.keys(me.k).filter(k => me.k[k].tot > 0).map(key => { const [c, k] = key.split('|'); const a = quAvg(ag, 'k', key, 'ok', 'tot'); return { c, k, ok: me.k[key].ok, tot: me.k[key].tot, avg: a == null ? null : Math.round(a * 10) / 10 }; }) : []; };
const rptUnits = (ag, sid) => { const me = ag[sid]; return me ? Object.keys(me.u).filter(k => me.u[k].t > 0).map(k => { const a = quAvg(ag, 'u', k, 'w', 't'), i = k.indexOf('|'); return { c: k.slice(0, i), u: k.slice(i + 1), w: me.u[k].w, t: me.u[k].t, avg: a == null ? null : Math.round(a * 10) / 10 }; }) : []; };

/* 분석 결과 문장 (규칙 기반, 선생님이 미리보기에서 고칠 수 있어요) */
function rptAnalyze(B, mode) {
  const L = [], f1 = v => (Math.round(v * 10) / 10).toFixed(1), sc = (B.scores || []).filter(p => p.t != null);
  const scope = mode === 'month' ? '이번 달' : cn(B.c) + '과정';
  const mean = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
  let rel = null;
  if (sc.length) {
    const avg = mean(sc.map(p => p.t)); rel = mean(sc.filter(p => p.a != null).map(p => p.t - p.a)); const top = Math.max(...sc.map(p => p.t));
    L.push(`${scope} 누적테스트 ${sc.length}회 평균은 ${f1(avg)}점이고 최고 ${top}점이에요.` + (rel == null ? '' : Math.abs(rel) < 0.5 ? ' 반 평균과 비슷한 수준이에요.' : ` 반 평균보다 ${f1(Math.abs(rel))}점 ${rel > 0 ? '높아요' : '낮아요'}.`));
    if (sc.length >= 5) { const rc = mean(sc.slice(-3).map(p => p.t)), pv = mean(sc.slice(0, -3).map(p => p.t)), d = rc - pv; L.push(Math.abs(d) < 1 ? '최근 점수는 이전과 비슷하게 유지되고 있어요.' : `최근 3회 평균이 이전보다 ${f1(Math.abs(d))}점 ${d > 0 ? '올랐어요' : '내려갔어요'}.`); }
  } else L.push(`${scope}에는 아직 반영할 시험 기록이 없어요.`);
  const ks = (B.kinds || []).filter(x => x.tot >= 3).map(x => ({ ...x, v: x.ok / x.tot * 100, l: `${cn(x.c)} ${KIND_T[x.k]}` })).sort((a, b) => b.v - a.v);
  if (ks.length >= 2 && ks[0].v - ks[ks.length - 1].v >= 10) L.push(`영역별로는 ${ks[0].l}의 정답률이 ${Math.round(ks[0].v)}%로 가장 높고, ${ks[ks.length - 1].l}이 ${Math.round(ks[ks.length - 1].v)}%로 가장 낮아요.`);
  else if (ks.length) L.push('영역별 정답률은 고른 편이에요.');
  const us = (B.units || []).filter(x => x.t >= 2).map(x => ({ ...x, v: x.w / x.t * 100 })).sort((a, b) => b.v - a.v || b.t - a.t), weak = us.filter(x => x.v >= 30).slice(0, 3);
  if (weak.length) L.push(`오답률이 높은 단원은 ${weak.map(x => `${x.c} ${x.u}(${Math.round(x.v)}%)`).join(', ')}예요. 이 단원을 중심으로 오답을 다시 풀어 보면 좋아요.`);
  else if (us.length) L.push('단원별 오답률이 낮아 전반적으로 고르게 이해하고 있어요.');
  const hw = B.hwOpen || [];
  L.push(hw.length ? `미완료 과제가 ${hw.length}건 있어요 (${hw.slice(0, 3).map(h => h.item).join(', ')}${hw.length > 3 ? ' 외' : ''}). 다음 수업 전까지 마무리해 주세요.` : '미완료 과제 없이 성실하게 해내고 있어요.');
  if (mode === 'month' && B.absN) L.push(`이번 달 결석이 ${B.absN}회 있었어요. 결석한 수업의 내용은 꼭 보충해 주세요.`);
  L.push(rel != null && rel < -0.5 ? '약한 부분을 차근차근 채워 가면 충분히 올라갈 수 있어요. 응원합니다!' : '지금처럼 꾸준히 이어 가길 응원합니다!');
  return L.join('\n');
}
const rptEditKey = (s, month, k) => s.id + '|' + month + '|' + k;

/* 학생 한 명의 리포트 데이터. 다른 학생 이름·순위·상담 내용·결제 정보는 넣지 않아요 */
const rptNt = s => { const a = (S.roster.nta || {})[s.id]; return a && a.analysis && a.analysis.length ? { analysis: a.analysis.slice(0, 12), course: a.course || '', at: a.at || '' } : null; };
function rptBuild(s, month, withNotes, courses) {
  const cls = clsById(s.cls), asOf = todayStr(), monthEnd = month + '-31', r1 = v => v == null ? null : Math.round(v * 10) / 10, inM = d => String(d || '').slice(0, 7) === month;
  const hist = stuHistory(s), mk = p => ({ c: p.c, n: p.n, d: p.d, t: p.total, a: r1(p.avg), m: p.max == null ? null : p.max });
  const tests = hist.filter(p => !p.fin && p.d && p.total != null).sort((a, b) => a.d.localeCompare(b.d));
  const mean = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
  const mScores = tests.filter(p => inM(p.d) && p.d <= asOf).map(mk), prevAvg = mean(tests.filter(p => p.d.slice(0, 7) < month).slice(-4).map(p => p.total));
  const sess = hist.filter(p => p.src === 'sess' && inM(p.d) && p.d <= asOf);
  const agM = cls ? quStats(cls, r => inM(r.d) && r.d <= asOf) : {};
  const m = {
    scores: mScores, prevAvg: r1(prevAvg), hwOpen: rptHwOpen(s, r => inM(r.d) && r.d <= asOf),
    sessN: sess.filter(p => p.total != null || p.g || p.abs).length, absN: sess.filter(p => p.abs).length,
    notes: withNotes ? sess.filter(p => p.ann).sort((a, b) => a.d.localeCompare(b.d)).slice(-3).map(p => ({ d: p.d, c: p.c, n: p.n, text: p.ann.slice(0, 500) })) : [],
    kinds: rptKinds(agM, s.id), units: rptUnits(agM, s.id)
  };
  m.analysis = RPT.edit[rptEditKey(s, month, 'm')] || rptAnalyze(m, 'month');
  const fins = finStuRows(s).filter(x => x.has && x.d && x.d <= asOf);
  const cs = (courses || []).map(c => {
    const ag = cls ? quStats(cls, r => r.c === c && r.d <= asOf) : {};
    const b = {
      c, scores: tests.filter(p => p.c === c && p.d <= asOf).map(mk), hwOpen: rptHwOpen(s, r => r.c === c && r.d <= asOf),
      fin: fins.filter(x => x.c === c).map(x => ({ name: x.name, d: x.d, t: x.tot, a: r1(x.fa && x.fa.avg != null ? x.fa.avg : x.avg), m: x.fa && x.fa.max != null ? x.fa.max : x.max })),
      kinds: rptKinds(ag, s.id), units: rptUnits(ag, s.id)
    };
    b.analysis = RPT.edit[rptEditKey(s, month, 'c:' + c)] || rptAnalyze(b, 'course'); return b;
  });
  return { v: 2, month, asOf, name: s.name, cls: cls ? clsName(cls.id) : '', max: Math.max(20, ...tests.map(p => Math.ceil(p.total || 0))), finMax: FIN_Q, m, courses: cs, nt: rptNt(s) };
}

  <section class="card stack"><div class="card-h" style="margin:0"><h3>2. 학생 계정</h3><span class="sub">로그인 ID는 학생 전화번호, 처음 비밀번호는 모두 0000이에요</span></div>
    <div class="row"><button class="btn" data-act="rpt-ids">전화번호로 ID 부여</button><button class="btn" data-act="rpt-csv">계정 CSV 받기</button></div>
    ${(RPT.idInfo || []).map(t => `<div class="banner">${esc(t)}</div>`).join('')}
    <div class="small muted">CSV를 <b>provision.js</b>로 올리면 학생 계정이 만들어져요. 학생은 전화번호와 0000으로 처음 들어온 뒤 <b>반드시 새 비밀번호로 바꿔야</b> 리포트를 볼 수 있어요. 이미 만든 계정은 다시 올려도 바뀌지 않아요.</div></section>
  <section class="card stack"><div class="card-h" style="margin:0"><h3>3. 성적 리포트 발행</h3></div>
    <div class="row"><div class="field" style="width:160px"><label for="rpt-m">월</label><input id="rpt-m" type="month" value="${esc(RPT.month)}" data-ch="rpt-month"></div>
      <div class="seg" role="group" aria-label="반 선택">${visCls().map(c => `<button data-act="rpt-cls" data-id="${esc(c.id)}" aria-pressed="${c.id === clsId}">${esc(c.name)}</button>`).join('')}</div></div>
    <details class="card"><summary style="cursor:pointer"><b>리포트 설정</b> <span class="small muted">안내 문구 ${RPT.notes ? '포함' : '제외'} · 과정 ${sel.length ? sel.map(cn).join(', ') : '없음'}</span></summary><div class="stack" style="margin-top:8px"><label class="row" style="gap:6px"><input type="checkbox" data-ch="rpt-auto" ${RPT.auto ? 'checked' : ''}>매일 밤 9:40 발행된 리포트 자동 갱신 <span class="small muted">(이 사이트를 열어 둔 기기에서만 · 안 열었으면 다음에 열 때 갱신)</span></label><div><button class="btn sm" data-act="rpt-auto-now">지금 갱신하기</button></div><label class="row" style="gap:6px"><input type="checkbox" data-ch="rpt-notes" ${RPT.notes ? 'checked' : ''}>선생님 안내 문구 포함</label>
    <div class="field"><label>“과정별” 탭에 보여줄 과정 (학생에게 이 과정들만 보여요)</label><div class="row" style="gap:10px">${opts.length ? opts.map(c => `<label class="row" style="gap:5px"><input type="checkbox" data-ch="rpt-course" data-c="${esc(c)}" ${sel.includes(c) ? 'checked' : ''}>${esc(cn(c))}과정</label>`).join('') : '<span class="small muted">이 반의 수업 기록이 없어요</span>'}</div></div></div></details>
    <div class="tbl-wrap"><table><thead><tr><th>이름</th><th>로그인 ID</th><th>데이터 상태</th><th>리포트 상태</th><th>작업</th></tr></thead><tbody>${rows || '<tr><td colspan="5" class="empty">이 반에 학생이 없어요</td></tr>'}</tbody></table></div>
    <div class="row end" style="gap:8px;flex-wrap:wrap"><button class="btn" data-act="rpt-pub-changed" ${ready && !RPT.busy ? '' : 'disabled'}>수정된 학생만 재발행</button><button class="btn" data-act="rpt-pub-ready" ${ready && !RPT.busy ? '' : 'disabled'}>준비된 학생만 발행</button><button class="btn pri" data-act="rpt-pub-all" ${ready && !RPT.busy ? '' : 'disabled'}>${RPT.busy ? '올리는 중…' : '이 반 전체 발행'}</button></div>
    <div class="small muted">발행하면 그 달 리포트가 새로 만들어져 올라가고, 같은 달을 다시 발행하면 덮어써요. 학생은 본인 것만 볼 수 있어요.</div></section>${prev}`;
};

ACT['rpt-login'] = async () => {
  const em = ($('#rpt-em') || {}).value, pw = ($('#rpt-pw') || {}).value; RPT.err = '';
  if (!em || !pw) { toast('이메일과 비밀번호를 입력해 주세요'); return; }
  try { const sb = await rptClient(); const r = await sb.auth.signInWithPassword({ email: em.trim(), password: pw }); if (r.error) throw new Error('로그인하지 못했어요. 이메일/비밀번호를 확인해 주세요'); RPT.user = r.data.user; await rptCheckTeacher(); toast('로그인했어요'); }
  catch (e) { RPT.err = e.message; }
  render();
};
ACT['rpt-out'] = async () => { try { await RPT.sb.auth.signOut(); } catch (e) { } RPT.user = null; RPT.isTeacher = false; if (P.db && S.storage === 'server') { location.reload(); return; } render(); };
ACT['rpt-cls'] = b => { RPT.cls = b.dataset.id; RPT.prev = null; render(); };
ACT['rpt-prev'] = b => { RPT.prev = b.dataset.sid; render(); };
ACT['rpt-prev-x'] = () => { RPT.prev = null; render(); };
CH['rpt-month'] = el => { if (/^\d{4}-\d{2}$/.test(el.value)) { RPT.month = el.value; render(); } };
CH['rpt-notes'] = el => { RPT.notes = el.checked; render(); };
CH['rpt-course'] = el => { const cls = rptClsObj(); if (!cls) return; const cur = new Set(rptSelCourses(cls)); if (el.checked) cur.add(el.dataset.c); else cur.delete(el.dataset.c); RPT.courses[cls.id] = ALLC().filter(c => cur.has(c)); rptSaveCourses(); render(); };
CH['rpt-an'] = el => { const s = S.roster.students.find(x => x.id === el.dataset.sid); if (!s) return; const key = rptEditKey(s, RPT.month, el.dataset.k), v = el.value.trim(); if (v) RPT.edit[key] = v; else delete RPT.edit[key]; render(); };
CH['rpt-lid'] = el => {
  const s = S.roster.students.find(x => x.id === el.dataset.sid); if (!s) return; const v = el.value.trim().toLowerCase();
  if (v && !/^[a-z0-9_]{3,24}$/.test(v)) { toast('ID는 영문 소문자·숫자·밑줄 3~24자예요'); render(); return; }
  if (v && S.roster.students.some(x => x.id !== s.id && x.lid === v)) { toast('이미 다른 학생이 쓰는 ID예요'); render(); return; }
  s.lid = v || undefined; commit('roster', `${s.name} 로그인 ID 변경`); render();
};
ACT['rpt-ids'] = () => {
  const all = S.roster.students.filter(s => isLive(s)), used = new Map(); all.forEach(s => { if (s.lid && !rptAutoLid(s.lid)) used.set(s.lid, s.id); });
  let n = 0; const noPhone = [], dup = [];
  all.forEach(s => {
    if (s.lid && !rptAutoLid(s.lid)) return;
    const id = rptPhoneId(s);
    if (!id) { noPhone.push(s.name); if (rptAutoLid(s.lid)) s.lid = undefined; return; }
    if (used.has(id)) { const o = S.roster.students.find(x => x.id === used.get(id)); dup.push(`${s.name}(${o ? o.name + ' 학생과 ' : ''}같은 번호)`); return; }
    s.lid = id; used.set(id, s.id); n++;
  });
  RPT.idInfo = [noPhone.length ? `전화번호가 없거나 이상한 학생 ${noPhone.length}명: ${noPhone.join(', ')} → 명단에서 전화번호를 입력해 주세요.` : '', dup.length ? `같은 번호를 쓰는 학생 ${dup.length}명: ${dup.join(', ')} → ID 칸에 번호 뒤에 _2 처럼 직접 붙여 구분해 주세요.` : ''].filter(Boolean);
  if (n) { commit('roster', `학생 로그인 ID ${n}명 부여(전화번호)`); toast(`${n}명에게 전화번호 ID를 부여했어요`); } else toast('새로 부여할 학생이 없어요');
  render();
};
ACT['rpt-csv'] = () => {
  const list = S.roster.students.filter(s => isLive(s) && s.lid && !rptAutoLid(s.lid)), miss = S.roster.students.filter(s => isLive(s)).length - list.length;
  if (!list.length) { toast('먼저 [전화번호로 ID 부여]를 눌러 주세요'); return; }
  const q = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
  const csv = ['id,name,class'].concat(list.map(s => [s.lid, s.name, (clsById(s.cls) || {}).name || ''].map(q).join(','))).join('\r\n');
  blobDownload('accounts.csv', csv); toast(`${list.length}명 계정 CSV를 받았어요` + (miss ? ` (ID 없는 ${miss}명 제외)` : ''));
};
/* ===== 리포트 탭: 학생별 데이터 상태 · 서버 기준 리포트 상태 · 준비된 학생만/변경분만 발행 ===== */
const rptSig = P => JSON.stringify(P, (k, v) => k === 'asOf' ? undefined : v);
function rptDataState(s, sel) {
  if (!s.lid) return { t: 'ID 필요', tone: 'bad', ok: false };
  let miss = 0; Object.values(S.sess).forEach(rec => { if (rec.cls !== s.cls || finOf(rec) || !rec.d || rec.d > todayStr() || !sel.includes(rec.c)) return; const st = stats(rec); if (!st.n) return; const r = rec.r && rec.r[s.id]; if (!r || stOf(r) !== 'ok') return; if (s.joined && rec.d < s.joined) return; if (!calc(rec, r)) miss++; });
  return miss ? { t: `점수 ${miss}건 미입력`, tone: 'warn', ok: false } : { t: '확인 완료', tone: 'good', ok: true };
}
async function rptLoadSrv() {
  if (!RPT.user || !RPT.isTeacher || !RPT.sb) return; const k = RPT.month + '|' + (RPT.cls || ''); if (RPT.srvKey === k || RPT.srvBusy) return; RPT.srvBusy = true;
  try { const lids = rptStudents().map(s => s.lid).filter(Boolean); RPT.srv = {}; if (lids.length) { const r = await RPT.sb.from('reports').select('student_code,updated_at,payload').eq('month', RPT.month).in('student_code', lids); if (r.error) throw new Error(r.error.message); (r.data || []).forEach(x => { RPT.srv[x.student_code] = x; }); } RPT.srvKey = k; }
  catch (e) { RPT.err = '발행 상태를 읽지 못했어요: ' + e.message; RPT.srvKey = k; }
  RPT.srvBusy = false; if (S.ui.tab === 'student' || S.ui.tab === 'rpt') render();
}
function rptStatus(s, sel) {
  const x = RPT.srv && RPT.srv[s.lid]; if (!RPT.srv || RPT.srvKey == null) { const at = RPT.pub[(s.lid || '') + '|' + RPT.month]; return at ? { t: '발행됨 ' + new Date(at).toLocaleDateString('ko-KR', { month: 'numeric', day: 'numeric' }), tone: 'good', st: 'pub' } : { t: '미발행', tone: '', st: 'none' }; }
  if (!x) return { t: '미발행', tone: '', st: 'none' }; const d = new Date(x.updated_at).toLocaleDateString('ko-KR', { month: 'numeric', day: 'numeric' });
  let ch = false; try { ch = rptSig(x.payload) !== rptSig(rptBuild(s, RPT.month, RPT.notes, sel)); } catch (e) { }
  return ch ? { t: '수정됨 · 재발행 필요 (' + d + ' 발행)', tone: 'warn', st: 'changed' } : { t: '발행 완료 ' + d, tone: 'good', st: 'pub' };
}
ACT['rpt-pub-ready'] = () => { const sel = rptSelCourses(rptClsObj()); const L = rptStudents().filter(s => rptDataState(s, sel).ok && rptStatus(s, sel).st !== 'pub'); if (!L.length) { toast('발행할 준비가 된 학생이 없어요 (이미 발행했거나 데이터 확인이 필요해요)'); return; } if (confirm(`데이터 확인이 끝난 ${L.length}명의 ${RPT.month} 리포트를 발행할까요?`)) rptPublish(L); };
ACT['rpt-pub-changed'] = () => { const sel = rptSelCourses(rptClsObj()); const L = rptStudents().filter(s => s.lid && rptStatus(s, sel).st === 'changed'); if (!L.length) { toast('수정되어 다시 발행할 학생이 없어요'); return; } if (confirm(`수정된 ${L.length}명의 ${RPT.month} 리포트를 다시 발행할까요?`)) rptPublish(L); };
/* ===== 발행 막기 + 매일 밤 9:40 자동 갱신 (이미 발행된 리포트만) ===== */
try { RPT.hold = JSON.parse(localStorage.getItem('eden_rpt_hold') || '{}') || {}; } catch (e) { RPT.hold = {}; }
RPT.auto = (() => { try { return localStorage.getItem('eden_rpt_auto') !== '0'; } catch (e) { return true; } })();
const rptSaveHold = () => { try { localStorage.setItem('eden_rpt_hold', JSON.stringify(RPT.hold)); } catch (e) { } };
const rptHeld = s => !!(s && s.lid && RPT.hold[s.lid]);
async function rptAutoRun(manual) {
  if (RPT.autoBusy) return; RPT.autoBusy = true;
  try {
    const sb = await rptClient(); if (RPT.user && !RPT.isTeacher) await rptCheckTeacher();
    if (!RPT.user || !RPT.isTeacher) { if (manual) toast('선생님 로그인이 필요해요'); return; }
    await rptView(); const month = todayStr().slice(0, 7);
    const all = S.roster.students.filter(s => s.lid && !rptHeld(s)); if (!all.length) return;
    const r = await sb.from('reports').select('student_code,payload').eq('month', month).in('student_code', all.map(s => s.lid)); if (r.error) throw new Error(r.error.message);
    const have = {}; (r.data || []).forEach(x => { have[x.student_code] = x; });
    const rows = []; all.forEach(s => { const x = have[s.lid]; if (!x) return; const sel = rptSelCourses(clsById(s.cls)); let P; try { P = rptBuild(s, month, RPT.notes, sel); } catch (e) { return; } if (rptSig(P) !== rptSig(x.payload)) rows.push({ student_code: s.lid, month, payload: P, updated_at: new Date().toISOString() }); });
    if (rows.length) { const u = await sb.from('reports').upsert(rows, { onConflict: 'student_code,month' }); if (u.error) throw new Error(u.error.message); RPT.srvKey = null; }
    try { localStorage.setItem('eden_rpt_autoday', todayStr()); } catch (e) { } RPT.autoLast = { n: rows.length, students: all.length, published: Object.keys(have).length, at: Date.now() };
    if (manual || rows.length) toast(rows.length ? `발행된 리포트 ${rows.length}건을 최신으로 갱신했어요` : '갱신할 리포트가 없어요 (모두 최신)');
    if (S.ui.tab === 'rpt') render();
  } catch (e) { RPT.err = '자동 갱신 실패: ' + e.message; if (manual) toast('자동 갱신 실패: ' + e.message); } finally { RPT.autoBusy = false; }
}
function rptAutoTick() {
  if (!RPT.auto) return; const d = new Date(), hm = d.getHours() * 60 + d.getMinutes(); let last = ''; try { last = localStorage.getItem('eden_rpt_autoday') || ''; } catch (e) { }
  if (hm >= 21 * 60 + 40 && last !== todayStr()) rptAutoRun(false);
}
setInterval(rptAutoTick, 60000); setTimeout(() => { try { const last = localStorage.getItem('eden_rpt_autolast') || ''; if (RPT.auto && last !== todayStr()) { localStorage.setItem('eden_rpt_autolast', todayStr()); rptAutoRun(false); } } catch (e) { } }, 6000);
ACT['rpt-hold'] = b => { const s = S.roster.students.find(x => x.id === b.dataset.sid); if (!s || !s.lid) return; if (RPT.hold[s.lid]) { delete RPT.hold[s.lid]; rptSaveHold(); toast(s.name + ' 발행 막기를 풀었어요'); render(); return; } RPT.hold[s.lid] = 1; rptSaveHold(); toast(s.name + ' 발행을 막았어요 (자동 갱신도 멈춰요)'); render(); };
ACT['rpt-withdraw'] = async b => { const s = S.roster.students.find(x => x.id === b.dataset.sid); if (!s || !s.lid) return; if (!confirm(s.name + ' 학생의 ' + RPT.month + ' 리포트를 학생 화면에서 내릴까요? (다시 발행하면 다시 보여요)')) return; try { const sb = await rptClient(); const r = await sb.from('reports').delete().eq('student_code', s.lid).eq('month', RPT.month); if (r.error) throw new Error(r.error.message); delete RPT.pub[s.lid + '|' + RPT.month]; rptSavePub(); RPT.srvKey = null; RPT.hold[s.lid] = 1; rptSaveHold(); toast('내렸어요 · 발행 막기도 켜 뒀어요'); } catch (e) { RPT.err = e.message; } render(); };
CH['rpt-auto'] = el => { RPT.auto = el.checked; try { localStorage.setItem('eden_rpt_auto', el.checked ? '1' : '0'); } catch (e) { } render(); };
ACT['rpt-auto-now'] = () => rptAutoRun(true);
async function rptPublish(list0) {
  const held = list0.filter(rptHeld), list = list0.filter(s => !rptHeld(s)); if (held.length) toast(held.map(s => s.name).join(', ') + ': 발행 막기 상태라 건너뛰었어요'); 
  RPT.err = '';
  if (!list.length) return;
  if (list.some(s => !s.lid)) { toast('로그인 ID가 없는 학생이 있어요'); return; }
  RPT.busy = true; render();
  return rptPublish2(list);
}
async function rptPublish2(list) {
  try {
    const sb = await rptClient(); await rptView(); const sel = rptSelCourses(rptClsObj());
    const rows = list.map(s => ({ student_code: s.lid, month: RPT.month, payload: rptBuild(s, RPT.month, RPT.notes, sel), updated_at: new Date().toISOString() }));
    const r = await sb.from('reports').upsert(rows, { onConflict: 'student_code,month' });
    if (r.error) throw new Error('올리지 못했어요: ' + r.error.message);
    const now = Date.now(); list.forEach(s => { RPT.pub[s.lid + '|' + RPT.month] = now; }); rptSavePub(); RPT.srvKey = null;
    toast(`${list.length}명 리포트를 발행했어요`);
  } catch (e) { RPT.err = e.message; }
  RPT.busy = false; render();
}
ACT['rpt-pub'] = b => { const s = S.roster.students.find(x => x.id === b.dataset.sid); if (s) rptPublish([s]); };
ACT['rpt-pub-all'] = () => { if (confirm(`${rptStudents().length}명의 ${RPT.month} 리포트를 발행할까요?`)) rptPublish(rptStudents()); };

boot().then(initSample).catch(e => { console.error(e); $('#view').innerHTML = '<div class="card empty">불러오지 못했어요. 새로고침해 주세요.</div>'; });


</script>
